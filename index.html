<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tylo</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Figtree', sans-serif;
      background: #f2ede8;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* ── GRID ── */
    #grid {
      display: grid;
      width: 100vw;
      height: 100vh;
    }

    .tile {
      width: 80px;
      height: 80px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      touch-action: none;
      position: relative;
    }

    .tile::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0);
      transition: background 0.15s ease;
      pointer-events: none;
    }

    .tile:hover::after {
      background: rgba(255, 255, 255, 0.2);
    }

    .tile svg {
      display: block;
      width: 80px;
      height: 80px;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: 40px 40px;
      will-change: transform;
    }

    /* ── SHUFFLE CASCADE ── */
    @keyframes tile-cascade {
      0%        { transform: scaleX(1);    }
      40%, 60%  { transform: scaleX(0);    }
      100%      { transform: scaleX(1);    }
    }

    .tile.cascading {
      animation: tile-cascade 0.28s ease-in-out both;
    }

    /* ── SWAP SUBMENU ── */
    #swap-menu {
      position: fixed;
      z-index: 500;
      width: 160px;
      height: 160px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-radius: 8px;
      overflow: hidden;
      box-shadow:
        0 0 0 1.5px rgba(255,255,255,0.35),
        0 8px 32px rgba(0,0,0,0.38),
        0 2px 8px  rgba(0,0,0,0.22);
      pointer-events: none;
      /* closed state */
      opacity: 0;
      transform: scale(0.72);
      transform-origin: center center;
      transition:
        opacity  0.18s cubic-bezier(0.4, 0, 0.2, 1),
        transform 0.18s cubic-bezier(0.34, 1.48, 0.64, 1);
    }

    #swap-menu.open {
      opacity: 1;
      transform: scale(1);
      pointer-events: all;
    }

    #swap-menu.closing {
      opacity: 0;
      transform: scale(0.72);
      pointer-events: none;
      transition:
        opacity  0.13s cubic-bezier(0.4, 0, 1, 1),
        transform 0.13s cubic-bezier(0.4, 0, 1, 1);
    }

    .swap-opt {
      width: 80px;
      height: 80px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      border: 1px solid rgba(0,0,0,0.07);
      transition: box-shadow 0.12s;
    }

    .swap-opt svg {
      display: block;
      width: 80px;
      height: 80px;
    }

    .swap-opt::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 0;
      box-shadow: inset 0 0 0 2.5px transparent;
      transition: box-shadow 0.12s;
      pointer-events: none;
    }

    .swap-opt:hover::after  { box-shadow: inset 0 0 0 2.5px rgba(255,255,255,0.65); }
    .swap-opt.current::after { box-shadow: inset 0 0 0 2.5px #fff; }

    /* ── MENU TOGGLE ── */
    #menu-toggle {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 32px;
      height: 32px;
      background: rgba(65, 65, 65, 0.88);
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: opacity 0.2s, background 0.15s;
      backdrop-filter: blur(4px);
    }
    #menu-toggle:hover { background: rgba(65,65,65,1); }
    #menu-toggle.hidden { opacity: 0; pointer-events: none; }

    /* ── SIDEBAR ── */
    #sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 240px;
      background: #414141;
      color: #fff;
      display: flex;
      flex-direction: column;
      z-index: 300;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #sidebar.open { transform: translateX(0); }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 16px 12px;
      flex-shrink: 0;
    }
    .sidebar-title { font-size: 20px; font-weight: 600; letter-spacing: 0.1em; }

    .sidebar-close {
      width: 24px; height: 24px;
      background: none; border: none; color: #fff;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; opacity: 0.55; border-radius: 4px;
      transition: opacity 0.15s; padding: 0;
    }
    .sidebar-close:hover { opacity: 1; }

    .sidebar-content {
      flex: 1; overflow-y: auto;
      padding: 0 16px 8px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .sidebar-content::-webkit-scrollbar { width: 3px; }
    .sidebar-content::-webkit-scrollbar-track { background: transparent; }
    .sidebar-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 2px; }

    .section-title { font-size: 16px; font-weight: 500; color: #fff; }

    .instruction-row { display: flex; align-items: center; gap: 10px; }
    .instruction-row .ti { font-size: 20px; width: 20px; text-align: center; flex-shrink: 0; opacity: 0.65; }
    .instruction-row span { font-size: 12px; color: rgba(255,255,255,0.65); line-height: 1.4; }

    .color-row { display: flex; gap: 8px; }
    .color-btn {
      flex: 1; height: 32px;
      display: flex; align-items: center; gap: 6px; padding: 0 8px;
      background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px; color: #fff; cursor: pointer;
      font-family: 'Figtree', sans-serif; font-size: 12px;
      transition: background 0.15s; position: relative; overflow: hidden;
    }
    .color-btn:hover { background: rgba(255,255,255,0.16); }
    .color-swatch { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid rgba(255,255,255,0.25); pointer-events: none; }
    .color-btn .btn-label { pointer-events: none; flex: 1; }
    .reset-x { font-size: 15px; line-height: 1; opacity: 0.45; transition: opacity 0.15s; cursor: pointer; padding: 2px; z-index: 1; }
    .reset-x:hover { opacity: 1; }
    input[type="color"].hidden-picker { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: none; padding: 0; }

    .action-btn {
      width: 100%; height: 32px;
      display: flex; align-items: center; gap: 8px; padding: 0 8px;
      background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px; color: #fff; cursor: pointer;
      font-family: 'Figtree', sans-serif; font-size: 14px; font-weight: 400;
      transition: background 0.15s; text-align: left;
    }
    .action-btn:hover { background: rgba(255,255,255,0.16); }
    .action-btn .ti { font-size: 16px; opacity: 0.75; }
    .action-btn .btn-label { flex: 1; }


    .divider { height: 1px; background: rgba(255,255,255,0.1); margin: 2px -16px; }

    /* ── BOARD PICKER ── */
    .board-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .board-opt {
      cursor: pointer;
      border-radius: 7px;
      overflow: hidden;
      border: 2px solid transparent;
      transition: border-color 0.15s;
      background: rgba(255,255,255,0.06);
    }
    .board-opt:hover  { border-color: rgba(255,255,255,0.28); }
    .board-opt.active { border-color: rgba(255,255,255,0.72); }

    .board-thumb {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
    }

    .board-thumb svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .board-name {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      text-align: center;
      padding: 5px 4px 6px;
      letter-spacing: 0.02em;
    }
    .board-opt.active .board-name { color: rgba(255,255,255,0.9); }

    .sidebar-footer {
      padding: 10px 16px 20px;
      display: flex; flex-direction: column; gap: 1px; flex-shrink: 0;
    }
    .sidebar-footer span { font-size: 12px; color: rgba(255,255,255,0.28); line-height: 1.7; }
  </style>
</head>
<body>

    <i class="ti ti-layout-sidebar-left-expand" style="font-size:16px"></i>
  </button>

      <span class="sidebar-title">TYLO</span>

    </div>

        <i class="ti ti-hand-finger"></i>
        <span>tap a tile to rotate clockwise</span>
      </div>
      <div class="instruction-row">

        <span>long press to swap tile shape</span>
      </div>

      <div class="divider"></div>

      <div class="color-row">
        <button class="color-btn" id="color1-btn">
          <span class="color-swatch" id="color1-swatch"></span>

        <button class="color-btn" id="color2-btn">
          <span class="color-swatch" id="color2-swatch"></span>
          <span class="btn-label">shape</span>
          <span class="reset-x" id="color2-reset"><i class="ti ti-refresh"></i></span>
          <input type="color" class="hidden-picker" id="color2-input" value="#837a72">
        </button>
      </div>

      <button class="action-btn" id="shuffle-btn">
        <i class="ti ti-arrows-shuffle"></i>
        <span class="btn-label">shuffle tiles</span>
      </button>

      <div class="divider"></div>

      <span class="section-title">choose a board</span>

      <div class="board-grid" id="board-picker"></div>

    </div>

    <div class="sidebar-footer">
      <span>a digital tile toy.</span>
      <span>designed by leo rossoni 2025</span>
    </div>
  </aside>

  <div id="swap-menu"></div>

    /* ─────────────────────────────────────────
       HIGHWAY PIECES — each interior shape renders as its own
       svg layer so its drop shadow isn't swallowed by neighbors
    ───────────────────────────────────────── */
    function hwPiece(vb, geom, c1, c2) {
      return `<svg viewBox="${vb}" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden;">
        <g style="filter:blur(8px);opacity:0.6;mix-blend-mode:multiply;">${geom('#000000')}</g>
        ${geom(c2, c1)}
      </svg>`;
    }
    function hwRect(x, y, w, h, rx, transform) {
      return (fill, stroke) => `<rect x="${x}" y="${y}" width="${w}" height="${h}"${rx ? ` rx="${rx}"` : ''}${transform ? ` transform="${transform}"` : ''} fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="3"` : ''}/>`;
    }
    function hwPath(d) {
      return (fill, stroke) => `<path d="${d}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="3"` : ''}/>`;
    }

      },
    ];

    /* ─────────────────────────────────────────
       SVG BUILDER
    ───────────────────────────────────────── */
    let _clipSeq = 0;

    function wrapShapeMarkup(content, vb, clipId, sizeStyle) {
      // Array content = a highway-style tile: a frame containing one <svg>
      // per interior shape, each casting its own drop shadow.
      if (Array.isArray(content)) {
        return `<div class="tile-visual" style="${sizeStyle}position:relative;overflow:hidden;display:block;">${content.join('')}</div>`;
      }
      const [,,vw,vh] = vb.split(' ').map(Number);
      return `<svg class="tile-visual" viewBox="${vb}" fill="none" xmlns="http://www.w3.org/2000/svg" style="${sizeStyle}display:block;">
        <g clip-path="url(#${clipId})">${content}</g>
        <defs><clipPath id="${clipId}"><rect width="${vw}" height="${vh}" fill="white"/></clipPath></defs>
      </svg>`;
    }

    function buildSVG(shapeIndex, rotation, clipId, boardIdx) {
      const b = BOARDS[boardIdx !== undefined ? boardIdx : activeBoardIdx];
      const content = b.shapes[shapeIndex](color1, color2);
      const sizeStyle = `width:80px;height:80px;transform:rotate(${rotation}deg);transform-origin:40px 40px;transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);will-change:transform;`;
      return wrapShapeMarkup(content, b.vb, clipId, sizeStyle);
    }

    function renderTile(el, key) {
      const { shapeIndex, rotation } = tileStates.get(key);
      el.innerHTML = buildSVG(shapeIndex, rotation, `c_${key}`);
      // original board has transparent bg (color1 shows through body),
      // other boards embed their own background rect
      el.style.background = color1;
    }

    /* ─────────────────────────────────────────
       SWAP SUBMENU
    ───────────────────────────────────────── */
    const swapMenu = document.getElementById('swap-menu');

    function openSwapMenu(key, tileEl) {
      menuTarget = { key, tileEl };
      const { shapeIndex } = tileStates.get(key);

      // Build 4 options
      swapMenu.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const opt = document.createElement('div');
        opt.className = 'swap-opt' + (i === shapeIndex ? ' current' : '');
        opt.dataset.shape = i;
        opt.style.background = color1;
        // Render at 0° – options always show shape upright for easy recognition
        const uid = `sm_${++_clipSeq}`;
        opt.innerHTML = buildSVG(i, 0, uid, activeBoardIdx);
        swapMenu.appendChild(opt);
      }

      // Position: centre the 160×160 popup over the 80×80 tile
      const rect = tileEl.getBoundingClientRect();
      const cx   = rect.left + rect.width  / 2;
      const cy   = rect.top  + rect.height / 2;
      let   left = cx - 80;
      let   top  = cy - 80;

      // Clamp to viewport with 6px margin
      left = Math.max(6, Math.min(left, window.innerWidth  - 166));
      top  = Math.max(6, Math.min(top,  window.innerHeight - 166));

      swapMenu.style.left = left + 'px';
      swapMenu.style.top  = top  + 'px';

      // Scale origin = the tile's centre relative to the popup
      const originX = (cx - left).toFixed(1) + 'px';
      const originY = (cy - top ).toFixed(1) + 'px';
      swapMenu.style.transformOrigin = `${originX} ${originY}`;

      swapMenu.classList.remove('closing');
      swapMenu.classList.add('open');
    }

    function closeSwapMenu() {
      if (!menuTarget) return;
      menuTarget = null;
      swapMenu.classList.remove('open');
      swapMenu.classList.add('closing');
      swapMenu.addEventListener('transitionend', () => {
        swapMenu.classList.remove('closing');
      }, { once: true });
    }

    swapMenu.addEventListener('pointerdown', e => {
      const opt = e.target.closest('.swap-opt');
      if (!opt || !menuTarget) return;
      e.stopPropagation();

      const newShape = +opt.dataset.shape;
      const { key, tileEl } = menuTarget;

      // Apply new shape
      tileStates.get(key).shapeIndex = newShape;
      renderTile(tileEl, key);
      closeSwapMenu();
    });

    /* ─────────────────────────────────────────
       TILE CREATION
    ───────────────────────────────────────── */
    const grid = document.getElementById('grid');

    function createTile(col, row) {
      const key = `${col}_${row}`;
      if (!tileStates.has(key)) {
        tileStates.set(key, { shapeIndex: BOARDS[activeBoardIdx].defaultShape || 0, rotation: 0 });
      }

      const div = document.createElement('div');
      div.className = 'tile';
      div.dataset.key = key;
      renderTile(div, key);

      let pressTimer = null;

      function cancelPress() {
        if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      }

      div.addEventListener('pointerdown', e => {
        cancelPress();
        pressTimer = setTimeout(() => {
          pressTimer = null;
          openSwapMenu(key, div);
        }, 450);
      });

      div.addEventListener('pointerup', () => {
        // If timer still pending → short tap → rotate
        if (pressTimer) {
          cancelPress();
          const state = tileStates.get(key);
          state.rotation = (state.rotation + 90) % 360;
          div.querySelector('.tile-visual').style.transform = `rotate(${state.rotation}deg)`;
        }
      });

      div.addEventListener('pointerleave',  cancelPress);
      div.addEventListener('pointercancel', cancelPress);
      div.addEventListener('contextmenu',   e => e.preventDefault());

      return div;
    }

    /* ─────────────────────────────────────────
       GRID BUILD / REFRESH
    ───────────────────────────────────────── */
    function buildGrid() {
      closeSwapMenu();
      const cols = Math.ceil(window.innerWidth  / TILE_SIZE);
      const rows = Math.ceil(window.innerHeight / TILE_SIZE);
      grid.style.gridTemplateColumns = `repeat(${cols}, ${TILE_SIZE}px)`;
      grid.style.gridTemplateRows    = `repeat(${rows}, ${TILE_SIZE}px)`;
      grid.innerHTML = '';
      tileStates.clear();
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++)
          grid.appendChild(createTile(c, r));
    }

    function refreshColors() {
      grid.querySelectorAll('.tile').forEach(el => renderTile(el, el.dataset.key));
      refreshBoardPickerColors();
    }

    let _shuffleTimers = [];

    function shuffleTiles() {
      // Cancel any in-flight cascade
      _shuffleTimers.forEach(clearTimeout);
      _shuffleTimers = [];
      grid.querySelectorAll('.tile.cascading').forEach(el => {
        el.classList.remove('cascading');
        el.style.animationDelay = '';
      });

      const ANIM_MS   = 280;   // must match @keyframes duration
      const COL_GAP   = 100;   // ms between columns
      const SWAP_AT   = 0.45;  // fraction into animation when tile is invisible

      const cols = Math.ceil(window.innerWidth / TILE_SIZE);

      for (let c = 0; c < cols; c++) {
        const colDelay  = c * COL_GAP;
        const swapDelay = colDelay + ANIM_MS * SWAP_AT;
        const doneDelay = colDelay + ANIM_MS + 20;

        // Grab tiles in this column
        const colTiles = [...grid.querySelectorAll('.tile')]
          .filter(el => el.dataset.key.startsWith(c + '_'));

        // 1. Kick off animation
        _shuffleTimers.push(setTimeout(() => {
          colTiles.forEach(el => {
            el.style.animationDelay = '0ms';
            el.classList.remove('cascading');
            // Force reflow so re-adding the class re-triggers animation
            void el.offsetWidth;
            el.classList.add('cascading');
          });
        }, colDelay));

        // 2. Swap content when tile is scaled to 0 (invisible)
        _shuffleTimers.push(setTimeout(() => {
          colTiles.forEach(el => {
            const state = tileStates.get(el.dataset.key);
            state.rotation   = [0, 90, 180, 270][Math.floor(Math.random() * 4)];
            state.shapeIndex = Math.floor(Math.random() * BOARDS[activeBoardIdx].shapes.length);
            renderTile(el, el.dataset.key);
          });
        }, swapDelay));

        // 3. Clean up class after animation finishes
        _shuffleTimers.push(setTimeout(() => {
          colTiles.forEach(el => {
            el.classList.remove('cascading');
            el.style.animationDelay = '';
          });
        }, doneDelay));
      }
    }

    /* ─────────────────────────────────────────
       BOARD PICKER
    ───────────────────────────────────────── */
    function buildBoardPicker() {
      const picker = document.getElementById('board-picker');
      picker.innerHTML = '';

      BOARDS.forEach((board, idx) => {
        const opt = document.createElement('div');
        opt.className = 'board-opt' + (idx === activeBoardIdx ? ' active' : '');
        opt.dataset.board = idx;

        // 2×2 thumbnail — show first 4 shapes (or repeat if < 4)
        const thumb = document.createElement('div');
        thumb.className = 'board-thumb';
        for (let i = 0; i < 4; i++) {
          const uid = `bp_${idx}_${i}_${++_clipSeq}`;
          const cell = document.createElement('div');
          cell.style.cssText = `overflow:hidden;background:${color1}`;
          cell.innerHTML = wrapShapeMarkup(board.shapes[i](color1, color2), board.vb, uid, 'width:100%;height:100%;');
          thumb.appendChild(cell);
        }

        const name = document.createElement('div');
        name.className = 'board-name';
        name.textContent = board.label;

        opt.appendChild(thumb);
        opt.appendChild(name);
        picker.appendChild(opt);
      });

      picker.addEventListener('click', e => {
        const opt = e.target.closest('.board-opt');
        if (!opt) return;
        const idx = +opt.dataset.board;
        if (idx === activeBoardIdx) return;
        activeBoardIdx = idx;
        buildGrid();
        buildBoardPicker();   // re-render to update active state
        closeMenu();
      });
    }

    function refreshBoardPickerColors() {
      // Cheapest re-render: just rebuild the picker thumbnails
      buildBoardPicker();
    }

    /* ─────────────────────────────────────────
       GLOBAL POINTER – close menu on outside tap
    ───────────────────────────────────────── */
    document.addEventListener('pointerdown', e => {
      if (menuTarget && !swapMenu.contains(e.target)) closeSwapMenu();
      if (sidebar.classList.contains('open') &&
          !sidebar.contains(e.target) &&
          e.target !== menuToggle) closeMenu();
    }, { capture: true });

    /* ─────────────────────────────────────────
       SIDEBAR
    ───────────────────────────────────────── */
    const sidebar    = document.getElementById('sidebar');
    const menuToggle = document.getElementById('menu-toggle');

    function openMenu()  { sidebar.classList.add('open');    menuToggle.classList.add('hidden'); }
    function closeMenu() { sidebar.classList.remove('open'); menuToggle.classList.remove('hidden'); }

    menuToggle.addEventListener('click', openMenu);
    document.getElementById('menu-close').addEventListener('click', closeMenu);

    /* ─────────────────────────────────────────
       COLOR PICKERS
    ───────────────────────────────────────── */
    const c1Input  = document.getElementById('color1-input');
    const c2Input  = document.getElementById('color2-input');
    const c1Swatch = document.getElementById('color1-swatch');
    const c2Swatch = document.getElementById('color2-swatch');

    function applyColor(which, val) {
      if (which === 1) { color1 = val; c1Swatch.style.background = val; c1Input.value = val; }
      else             { color2 = val; c2Swatch.style.background = val; c2Input.value = val; }
      refreshColors();
    }

    c1Input.addEventListener('input', e => applyColor(1, e.target.value));
    c2Input.addEventListener('input', e => applyColor(2, e.target.value));

    document.getElementById('color1-reset').addEventListener('click', e => {
      e.stopPropagation(); applyColor(1, DEFAULT_C1);
    });
    document.getElementById('color2-reset').addEventListener('click', e => {
      e.stopPropagation(); applyColor(2, DEFAULT_C2);
    });

    document.getElementById('color1-btn').addEventListener('click', e => {
      if (e.target.id === 'color1-reset') e.preventDefault();
    });
    document.getElementById('color2-btn').addEventListener('click', e => {
      if (e.target.id === 'color2-reset') e.preventDefault();
    });

    c1Swatch.style.background = color1;
    c2Swatch.style.background = color2;

    /* ─────────────────────────────────────────
       SHUFFLE
    ───────────────────────────────────────── */
    document.getElementById('shuffle-btn').addEventListener('click', shuffleTiles);
    document.addEventListener('keydown', e => {
      if ((e.key === 'x' || e.key === 'X') && !e.metaKey && !e.ctrlKey) shuffleTiles();
    });

    /* ─────────────────────────────────────────
       RESIZE
    ───────────────────────────────────────── */
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(buildGrid, 150);
    });

    /* ─────────────────────────────────────────
       INIT
    ───────────────────────────────────────── */
    buildGrid();
    buildBoardPicker();
  </script>
</body>
</html>
